<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SonoPilot 项目主页">
    <title>SonoPilot</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f7f8fa;
        color: #172033;
      }

      main {
        width: min(90%, 42rem);
        text-align: center;
      }

      h1 {
        margin-bottom: 0.5rem;
        font-size: clamp(2.5rem, 8vw, 5rem);
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: #5d6678;
        font-size: 1.1rem;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #10131a;
          color: #f4f6fb;
        }

        p {
          color: #aeb7c8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SonoPilot</h1>
      <p>Welcome. This website is under construction.</p>
    </main>
  </body>
</html>
